services:
  - type: web
    name: medi-matrix-backend
    runtime: docker
    plan: free
    dockerContext: .
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health/live
    autoDeployTrigger: off # Prevent accidental auto-deploys from main if testing
    envVars:
      - key: APP_ENV
        value: production
      # Vision remains deterministic/demo until a verified imaging model exists.
      - key: INFERENCE_MODE
        value: demo
      # Vitals is independently enabled with the reviewed PhysioNet GRU artifact.
      - key: VITALS_INFERENCE_MODE
        value: model
      - key: SUPABASE_STORAGE_BUCKET
        value: medical-meshes
      - key: SUPABASE_VITALS_BUCKET
        value: medical-vitals
      - key: ALLOWED_ORIGINS
        sync: false # Set manually in dashboard
      - key: SUPABASE_URL
        sync: false # Set manually in dashboard
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false # Set manually in dashboard
      - key: SUPABASE_SECRET_KEY
        sync: false # Set manually in dashboard
