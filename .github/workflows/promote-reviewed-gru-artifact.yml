name: Promote Reviewed GRU Artifact

on:
  push:
    branches:
      - feat/real-vitals-ai-pipeline
    paths:
      - 'ml/promote_gru_artifact_trigger.txt'

permissions:
  contents: write
  actions: read

jobs:
  promote-artifact:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feat/real-vitals-ai-pipeline
          fetch-depth: 0

      - name: Download reviewed GRU artifact
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/reviewed-gru
          gh run download 33848975780 \
            --repo "$GITHUB_REPOSITORY" \
            --name real-vitals-gru-official-label-ddbc7246a3a733ebac747fe9931e62b57a027738 \
            --dir /tmp/reviewed-gru
          test -f /tmp/reviewed-gru/model.pt
          echo "182cebac9eae5bce456a904f00aee6e1d7650f3432e170783e437eab82eb202f  /tmp/reviewed-gru/model.pt" | sha256sum -c -

      - name: Promote deploy files and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          TARGET=backend/models/vitals_gru_challenge2019_v1
          mkdir -p "$TARGET"
          cp /tmp/reviewed-gru/model.pt "$TARGET/model.pt"
          cp /tmp/reviewed-gru/metrics.json "$TARGET/metrics.json"
          cp /tmp/reviewed-gru/preprocessor.json "$TARGET/preprocessor.json"
          cp /tmp/reviewed-gru/dataset_provenance.json "$TARGET/dataset_provenance.json"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f "$TARGET/model.pt"
          git add "$TARGET/metrics.json" "$TARGET/preprocessor.json" "$TARGET/dataset_provenance.json"
          git rm .github/workflows/promote-reviewed-gru-artifact.yml
          git rm ml/promote_gru_artifact_trigger.txt
          git commit -m "feat: promote reviewed GRU inference artifact"
          git push origin HEAD:feat/real-vitals-ai-pipeline
