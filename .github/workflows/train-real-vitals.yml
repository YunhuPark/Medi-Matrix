name: Train Real Vitals Baseline

on:
  push:
    branches:
      - feat/real-vitals-ai-pipeline
  workflow_dispatch:

permissions:
  contents: read

jobs:
  train-real-vitals:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install ML dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r ml/requirements.txt
          python -m pip check

      - name: Download official PhysioNet 2019 training sets
        shell: bash
        run: |
          set -euo pipefail
          RAW_ROOT="$RUNNER_TEMP/physionet-download"
          mkdir -p "$RAW_ROOT"

          wget -q -r -N -c -np \
            https://physionet.org/files/challenge-2019/1.0.0/training/ \
            -P "$RAW_ROOT"

          RAW_DIR="$RAW_ROOT/physionet.org/files/challenge-2019/1.0.0/training"
          PATIENT_COUNT=$(find "$RAW_DIR" -type f -name '*.psv' | wc -l | tr -d ' ')
          echo "patient_files=$PATIENT_COUNT"
          test "$PATIENT_COUNT" -ge 40000

          find "$RAW_DIR" -type f -name '*.psv' -print0 \
            | sort -z \
            | xargs -0 sha256sum \
            | sha256sum \
            | tee "$RUNNER_TEMP/source_tree_sha256.txt"

          echo "RAW_DIR=$RAW_DIR" >> "$GITHUB_ENV"

      - name: Convert real ICU records to Medi-Matrix six-Vitals schema
        shell: bash
        run: |
          set -euo pipefail
          python ml/prepare_physionet2019.py \
            --input "$RAW_DIR" \
            --output "$RUNNER_TEMP/physionet2019_vitals.csv" | tee "$RUNNER_TEMP/prepare.log"

      - name: Train leakage-safe Logistic Regression baseline
        shell: bash
        run: |
          set -euo pipefail
          ARTIFACT_DIR="$RUNNER_TEMP/vitals_logreg_v1"
          python ml/train_baseline.py \
            --data "$RUNNER_TEMP/physionet2019_vitals.csv" \
            --artifact-dir "$ARTIFACT_DIR" | tee "$RUNNER_TEMP/train.log"
          echo "ARTIFACT_DIR=$ARTIFACT_DIR" >> "$GITHUB_ENV"

      - name: Save dataset provenance
        shell: bash
        run: |
          set -euo pipefail
          PATIENT_COUNT=$(find "$RAW_DIR" -type f -name '*.psv' | wc -l | tr -d ' ')
          ROW_COUNT=$(($(wc -l < "$RUNNER_TEMP/physionet2019_vitals.csv") - 1))
          cat > "$ARTIFACT_DIR/dataset_provenance.json" <<EOF
          {
            "source": "PhysioNet/Computing in Cardiology Challenge 2019 v1.0.0",
            "official_url": "https://physionet.org/content/challenge-2019/1.0.0/",
            "download_url": "https://physionet.org/files/challenge-2019/1.0.0/training/",
            "patient_files": $PATIENT_COUNT,
            "hourly_rows": $ROW_COUNT,
            "feature_contract": ["HR", "SBP", "DBP", "Resp", "Temp", "O2Sat"],
            "target": "SepsisLabel",
            "training_run_sha": "${GITHUB_SHA}"
          }
          EOF
          cp "$RUNNER_TEMP/source_tree_sha256.txt" "$ARTIFACT_DIR/source_tree_sha256.txt"
          cp "$RUNNER_TEMP/prepare.log" "$ARTIFACT_DIR/prepare.log"
          cp "$RUNNER_TEMP/train.log" "$ARTIFACT_DIR/train.log"
          cat "$ARTIFACT_DIR/metrics.json"

      - name: Publish metrics to job summary
        shell: bash
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          p = Path(os.environ['ARTIFACT_DIR']) / 'metrics.json'
          m = json.loads(p.read_text())
          t = m['test']
          v = m['validation']
          summary = os.environ['GITHUB_STEP_SUMMARY']
          with open(summary, 'a', encoding='utf-8') as f:
              f.write('# Real Vitals baseline\n\n')
              f.write(f"- Model: `{m['model_name']}`\n")
              f.write(f"- Train/Val/Test patients: {m['split']['train_patients']} / {m['split']['validation_patients']} / {m['split']['test_patients']}\n")
              f.write(f"- Validation AUROC: {v['auroc']:.4f}\n")
              f.write(f"- Validation AUPRC: {v['auprc']:.4f}\n")
              f.write(f"- Test AUROC: **{t['auroc']:.4f}**\n")
              f.write(f"- Test AUPRC: **{t['auprc']:.4f}**\n")
              f.write(f"- Test sensitivity: {t['sensitivity']:.4f}\n")
              f.write(f"- Test specificity: {t['specificity']:.4f}\n")
              f.write(f"- Threshold selected only on validation split: {t['threshold']:.4f}\n")
          PY

      - name: Upload trained baseline and evaluation artifacts
        uses: actions/upload-artifact@v4
        with:
          name: real-vitals-logreg-${{ github.sha }}
          path: ${{ env.ARTIFACT_DIR }}
          if-no-files-found: error
          retention-days: 14
